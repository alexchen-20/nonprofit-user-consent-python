[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nonprofit-consent-service"
version = "0.1.0"
description = "Per-user consent grants and revocations for nonprofit workflows"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/nonprofit_consent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
